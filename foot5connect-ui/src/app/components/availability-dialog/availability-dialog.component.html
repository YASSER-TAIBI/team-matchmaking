<h2 mat-dialog-title>Renseignez votre <span>disponibilité</span></h2>

<form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()" mat-dialog-content>

  <div class="field-block">
    <div class="label">Date de disponibilité</div>
    <mat-form-field class="field" appearance="outline">
      <span matPrefix class="mat-icon-prefix"><i class="fa-solid fa-calendar"></i></span>
      <input matInput [matDatepicker]="picker" placeholder="Choisir une date" formControlName="availabilityDate" />
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  </div>

  <div class="field-block">
    <div class="label">Heure de début</div>
    <mat-form-field class="field" appearance="outline">
      <span matPrefix class="mat-icon-prefix"><i class="fa-solid fa-clock"></i></span>
      <input matInput type="time" placeholder="--:--" formControlName="startTime" />
      <mat-hint align="start" class="field-hint">Veuillez saisir l’heure en format 24h, (exemple : 14:30).</mat-hint>
    </mat-form-field>
  </div>

  <div class="field-block">
    <div class="label">Heure de fin</div>
    <mat-form-field class="field" appearance="outline">
      <span matPrefix class="mat-icon-prefix"><i class="fa-solid fa-clock"></i></span>
      <input matInput type="time" placeholder="--:--" formControlName="endTime" />
      <mat-hint align="start" class="field-hint">Veuillez saisir l’heure en format 24h, (exemple : 14:30).</mat-hint>
    </mat-form-field>
  </div>

  <div style="display:flex; justify-content:flex-end; gap:12px; margin-top: 8px;">
    <button mat-button type="button" (click)="onCancel()">Annuler</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Valider</button>
  </div>
</form>
