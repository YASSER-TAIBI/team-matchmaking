@if (visible) {
  <div class="dialog-overlay" (click)="onCancel()">
    <div class="dialog" (click)="$event.stopPropagation()">
      <span class="material-symbols-outlined dialog__icon">{{ icon }}</span>
      <h2 class="dialog__title">{{ title }}</h2>
      <p class="dialog__message">{{ message }}</p>
      @if (details.length > 0) {
        <div class="dialog__details">
          @for (detail of details; track detail) {
            <div class="dialog__detail-item">
              <span class="material-symbols-outlined dialog__detail-icon">check_circle</span>
              <span>{{ detail }}</span>
            </div>
          }
        </div>
      }
      <div class="dialog__actions">
        <button class="action-btn action-btn--cancel" type="button" (click)="onCancel()">{{ cancelText }}</button>
        <button class="action-btn action-btn--save" type="button" (click)="onConfirm()">{{ confirmText }}</button>
      </div>
    </div>
  </div>
}
