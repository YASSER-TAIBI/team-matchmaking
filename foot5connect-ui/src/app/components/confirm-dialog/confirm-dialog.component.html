<h2 mat-dialog-title>{{ data.title || 'Confirmation' }}</h2>

<div mat-dialog-content>
  {{ data.message }}
</div>

<div mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()">{{ data.cancelText || 'Annuler' }}</button>
  <button mat-raised-button color="primary" type="button" (click)="onConfirm()">{{ data.confirmText || 'Oui' }}</button>
</div>
